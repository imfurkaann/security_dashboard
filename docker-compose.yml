services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: security_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-security_management}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/bootstrap_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init/02-create-application-role.sh:/docker-entrypoint-initdb.d/02-create-application-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d ${DB_NAME:-security_management}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    secrets:
      - db_password
    networks:
      - security_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_PORT: ${FRONTEND_PORT:-33334}
      PUBLIC_HOST_IP: ${PUBLIC_HOST_IP:-169.58.124.2}
      FRONTEND_URL: ${FRONTEND_URL:-http://169.58.124.2:33334}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-security_management}
      DB_USER: ${DB_APP_USER:-security_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_MAX_AGE_MS: ${AUTH_COOKIE_MAX_AGE_MS:-28800000}
      ALLOW_BEARER_AUTH: "false"
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      AUTH_AUDIT_LOG_ENABLED: ${AUTH_AUDIT_LOG_ENABLED:-true}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      GUEST_REGISTRY_AUDIT_LOG_ENABLED: ${GUEST_REGISTRY_AUDIT_LOG_ENABLED:-true}
      GUEST_EXCEL_MAX_FILE_SIZE_MB: ${GUEST_EXCEL_MAX_FILE_SIZE_MB:-20}
      GUEST_EXCEL_MAX_ROWS: ${GUEST_EXCEL_MAX_ROWS:-100000}
      GUEST_EXCEL_MAX_COLUMNS: ${GUEST_EXCEL_MAX_COLUMNS:-200}
      GUEST_EXCEL_MAX_CELLS: ${GUEST_EXCEL_MAX_CELLS:-2000000}
      GUEST_EXCEL_MAX_SHEETS: ${GUEST_EXCEL_MAX_SHEETS:-50}
      GUEST_EXCEL_MAX_CELL_LENGTH: ${GUEST_EXCEL_MAX_CELL_LENGTH:-2000}
      TZ: Europe/Istanbul
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_SESSION_PATH: ${WHATSAPP_SESSION_PATH:-.baileys_auth}
      WHATSAPP_CONNECT_TIMEOUT_MS: ${WHATSAPP_CONNECT_TIMEOUT_MS:-30000}
      WHATSAPP_LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-silent}
    volumes:
      - ./backend/reports:/app/reports # Raporların silinmemesi için local klasöre bağladık
      - ./backend/sgk_kayitlari:/app/sgk_kayitlari # SGK dosyalarının silinmemesi için local klasöre bağladık
      - whatsapp_auth:/app/.baileys_auth # WhatsApp oturum dosyalarının update/restart sonrası korunması
      # Migration dosyaları - backend başlarken otomatik çalıştırılır
      - ./database/migrations:/app/migrations:ro
      - ./ERISIM_BILGILERI.txt:/app/ERISIM_BILGILERI.txt:ro
    secrets:
      - db_password
      - jwt_secret
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "runtime-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - security_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_LOW_RAM_BUILD=${VITE_LOW_RAM_BUILD:-false}
    container_name: security_frontend
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    ports:
      - "${FRONTEND_PORT:-33334}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - security_network

volumes:
  postgres_data:
    driver: local
    # VERİTABANI KORUMASI: Bu volume silinirse tüm veriler kaybolur!
    # ASLA "docker compose down -v" kullanmayın!
    # ASLA "docker volume rm security_postgres_data" kullanmayın!
    name: security_postgres_data
    labels:
      - "com.security.backup=required"
      - "com.security.critical=true"
      - "com.security.description=Güvenlik sistemi ana veritabanı - SİLMEYİN!"
  whatsapp_auth:
    driver: local
    name: security_whatsapp_auth
    labels:
      - "com.security.backup=recommended"
      - "com.security.description=Baileys WhatsApp auth session - SİLMEYİN!"

networks:
  security_network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
